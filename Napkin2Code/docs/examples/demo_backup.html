<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY LOGIN PAGE</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius: 1rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Layout: Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        /* Layout: Branding Header */
        .branding {
            text-align: center;
            padding: 2rem 1rem 1rem;
        }

        .branding h1 {
            font-size: 1.875rem;
            font-weight: 800;
            color: var(--text-main);
        }

        /* Main Content Container */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        /* The Login Card */
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border);
            text-align: center;
        }

        .login-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .login-card p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        /* Form Styles */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            text-align: left;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Feedback Message */
        #feedback {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            display: none;
        }

        .feedback-success {
            display: block !important;
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .feedback-error {
            display: block !important;
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        /* Footer Section */
        .footer-text {
            text-align: center;
            padding: 2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.025em;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .login-card {
                padding: 1.5rem;
                box-shadow: none;
                border: none;
            }
            .top-bar {
                flex-direction: column;
                gap: 0.5rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="top-left">MY LOGIN PAGE</div>
        <div class="top-right">keep it simple!</div>
    </header>

    <div class="branding">
        <h1>[ N ] Napkin Notes</h1>
    </div>

    <main>
        <div class="login-card">
            <h2>Welcome back</h2>
            <p>Sign in to your workspace</p>

            <form id="loginForm" class="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">Sign in</button>
                <div id="feedback" role="alert"></div>
            </form>
        </div>
    </main>

    <footer class="footer-text">
        center card / rounded corners / indigo button
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const feedback = document.getElementById('feedback');
            const submitBtn = document.getElementById('submitBtn');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Reset feedback
                feedback.className = '';
                feedback.textContent = '';

                // Simple Validation
                if (!emailInput.value || !passwordInput.value) {
                    feedback.textContent = "Please fill in all fields.";
                    feedback.classList.add('feedback-error');
                    return;
                }

                if (!emailInput.value.includes('@')) {
                    feedback.textContent = "Please enter a valid email address.";
                    feedback.classList.add('feedback-error');
                    return;
                }

                // Simulate API call
                submitBtn.disabled = true;
                submitBtn.textContent = 'Signing in...';
                submitBtn.style.opacity = '0.7';

                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign in';
                    submitBtn.style.opacity = '1';

                    // Prototype success message
                    feedback.textContent = "Success! (Note: This is a prototype and does not send real data)";
                    feedback.classList.add('feedback-success');
                    
                    // Clear inputs
                    emailInput.value = '';
                    passwordInput.value = '';
                }, 1200);
            });

            // Reset feedback on input
            [emailInput, passwordInput].forEach(input => {
                input.addEventListener('input', () => {
                    if (feedback.classList.contains('feedback-error')) {
                        feedback.className = '';
                        feedback.textContent = '';
                    }
                });
            });
        });
    </script>
</body>
</html>
